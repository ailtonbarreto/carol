<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="shortcut icon" href="../logo_asterisco.png" type="image/x-icon">
	<title>contato</title>

</head>

<style>
	:root {
		--primary-color: #0061C8;
		--text-color: #fff;
		--gray-color: #545759;
	}


	* {
		margin: 0;
		padding: 0;
		box-sizing: border-box;
		text-decoration: none;
	}

	body {
		margin: 0;
		font-family: "Zalando Sans", sans-serif;
	}

	nav {
		display: flex;
		color: var(--text-color);
	}

	header {
		position: fixed;
		width: 100%;
		display: flex;
		flex: 1 1 100vw;
		background: var(--primary-color);
		z-index: 1000;

		img {
			max-width: 30%;
		}
	}

	header #logo {
		display: flex;
		flex: 0 1 200px;
		justify-content: flex-start;
		align-items: center;
		padding: 0.2vw 0.5vw;
	}

	#openMenu,
	#closeMenu {
		border: none;
		background: none;
		font-size: 30px;
		font-weight: bold;
		padding: 0px 5px 0px 5px;
		cursor: pointer;
		display: none;
		color: var(--text-color);
		z-index: 1000;
	}

	nav {
		justify-content: flex-end;
		align-items: center;
		flex: 1 1 200px;
		z-index: 100;
	}

	nav a {
		margin: 0 3%;
		font-size: 15pt;
		color: var(--text-color);
	}


	.contact-section {
		display: flex;
		justify-content: center;
		padding: 60px 20px;
		color: var(--gray-color);
		font-family: 'Inter', sans-serif;
		height: 100vh;
		background-color: var(--text-color);
	}

	.contact-grid {
		display: grid;
		grid-template-columns: auto 1fr;
		align-items: center;
		justify-content: center;
		gap: 40px;
		margin: 0 20vw;
	}

	.form-section p {
		font-size: 1rem;
		line-height: 1.6;
		margin-bottom: 30px;
		opacity: 0.85;
		color: var(--primary-color);
	}


	iframe {
		padding: 0.3vw;
		border-radius: 0.5vw;
		width: 50vh;
		height: 80vh;
		background-color: var(--primary-color);
	}

	/* --------------------------------------------------------- */

	@media only screen and (max-width: 768px) {

		.contact-grid {
			margin-top: 5% !important;
			display: flex;
			flex-direction: column;
			gap: 40px;
			margin: 0 1vw;
		}

		#openMenu,
		#closeMenu {
			display: block;
		}

		#openMenu {
			margin-left: auto;
		}

		#closeMenu {
			position: fixed;
			right: 15px;
			top: 15px;
		}

		header {
			order: 0;
		}

		nav {
			position: fixed;
			width: 100vw;
			height: 100vh;
			background: rgba(5, 5, 5, 0.76);
			flex-direction: column;
			align-items: center;
			justify-content: center;
			margin: 0;
			display: none;
			opacity: 0;
			transition: 0.3s;
		}

		nav a {
			margin: 3%;
		}
	}
</style>

<body>
	<header>

		<a href="#" id="logo">

			<img src="../logo.png" alt="">

		</a>

		<button id="openMenu">&#9776;</button>

		<nav id="menu">

			<button id="closeMenu">X</button>

			<a href="../index.html">Início</a>
			<a href="#">Quem somos</a>
			<a href="#">Serviços</a>
			<a href="#">Contato</a>
		</nav>

	</header>


	<section class="contact-section">

		<div class="contact-grid">


			<div class="text-section">
				<h2>Gostou do nosso trabalho?</h2>

				<p>
					Entre em contato conosco para marcamos um café mesmo que virtual para
					conversamos sobre como a recuperação de créditos de ICMS pode te ajudar.
				</p>

			</div>

			<div class="form-section">

				<iframe src='https://app.pipefy.com/public/form/WKTYSMxT?embedded=true' frameborder='0'></iframe>

			</div>

		</div>


	</section>

	<!-- <section class="form">

		<iframe src='https://app.pipefy.com/public/form/WKTYSMxT?embedded=true' frameborder='0'></iframe>

	</section> -->


	<script src="../assets/js/script.js"></script>

</body>

</html>
